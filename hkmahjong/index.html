<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>港式台牌</title><style>body{margin:0;background:#064739;color:white;font:16px system-ui;text-align:center}header,.panel{padding:14px;margin:10px auto;max-width:720px;background:#07594b;border-radius:14px}button{border:0;border-radius:7px;padding:9px;margin:2px;font-size:17px}button.tile{background:#fff9e7;color:#17372d;min-width:39px;height:55px;border-bottom:5px solid #b9b2a0;font-size:22px}.river{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;min-height:75px}.river span{background:#efe5ce;color:#17372d;padding:5px;border-radius:4px}.muted{color:#b8d4cb}#actions button{background:#f2c867}#log{color:#ffe29a;min-height:30px}</style><header><h2>🀄 港式台牌</h2>四人單機試玩 · 基礎食糊</header><section class="panel"><div id="status"></div><div id="log"></div><button onclick="start()">重新開局</button></section><section class="panel"><div id="opps"></div><h3>牌河</h3><div id="river" class="river"></div></section><section class="panel"><h3>你的手牌（東）</h3><div id="meld"></div><div id="hand"></div><div id="actions"></div></section><script>
const names=['一','二','三','四','五','六','七','八','九'],honors=['東','南','西','北','中','發','白'],label=t=>t<27?names[t%9]+['萬','筒','索'][Math.floor(t/9)]:honors[t-27];let h,w,m,d,turn,over,pending,msg;
const sort=a=>a.sort((x,y)=>x-y),count=a=>{let c=Array(34).fill(0);a.forEach(t=>c[t]++);return c};
function sets(c){let i=c.findIndex(x=>x);if(i<0)return true;if(c[i]>=3){c[i]-=3;if(sets(c))return true;c[i]+=3}if(i<27&&i%9<7&&c[i+1]&&c[i+2]){c[i]--;c[i+1]--;c[i+2]--;if(sets(c))return true;c[i]++;c[i+1]++;c[i+2]++}return false}
function win(a){if(a.length%3!==2)return false;let c=count(a);for(let i=0;i<34;i++)if(c[i]>=2){c[i]-=2;if(sets(c))return true;c[i]+=2}return false}
function start(){w=Array.from({length:136},(_,i)=>Math.floor(i/4));for(let i=w.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[w[i],w[j]]=[w[j],w[i]]}h=[[],[],[],[]];m=[[],[],[],[]];d=[];turn=0;over=false;pending=null;msg='你是東家，請打出一張牌';for(let i=0;i<13;i++)for(let p=0;p<4;p++)h[p].push(w.pop());h[0].push(w.pop());h.forEach(sort);render()}
function action(s,fn){let b=document.createElement('button');b.textContent=s;b.onclick=fn;document.getElementById('actions').append(b)}
function render(){document.getElementById('status').textContent='牌牆剩餘 '+w.length+' 張 · '+(over?'本局結束':turn===0?'輪到你':'電腦出牌');document.getElementById('log').textContent=msg;document.getElementById('opps').textContent=[1,2,3].map(p=>['','南','北','西'][p]+'家：'+h[p].length+' 張').join('　');document.getElementById('river').innerHTML=d.map(x=>'<span>'+label(x.t)+'</span>').join('');document.getElementById('meld').textContent=m[0].map(a=>a.map(label).join(' ')).join(' | ');let hand=document.getElementById('hand');hand.innerHTML='';h[0].forEach((t,i)=>{let b=document.createElement('button');b.className='tile';b.textContent=label(t);b.disabled=over||turn!==0||!!pending;b.onclick=()=>discard(i);hand.append(b)});document.getElementById('actions').innerHTML='';if(over)return;if(pending){pending.forEach(a=>action(a[0],a[1]));action('過',()=>{pending=null;advance(d.at(-1).p)})}else if(turn===0&&win(h[0]))action('自摸食糊',()=>finish('你自摸食糊！'))}
function finish(s){over=true;pending=null;msg=s;render()}
function draw(p){if(!w.length){finish('流局');return false}h[p].push(w.pop());sort(h[p]);if(win(h[p])){finish(p===0?'你自摸食糊！':'電腦 '+p+' 自摸食糊！');return false}return true}
function discard(i){let t=h[0].splice(i,1)[0];d.push({p:0,t});turn=1;msg='你打出 '+label(t);render();setTimeout(cpu,350)}
function advance(p){turn=(p+1)%4;if(turn===0){if(draw(0)){msg='你摸了一張牌';render()}}else{render();setTimeout(cpu,350)}}
function claim(t,n){for(let i=0;i<n-1;i++)h[0].splice(h[0].indexOf(t),1);m[0].push(Array(n).fill(t));d.pop();pending=null;turn=0;if(n===4&&!draw(0))return;msg='你'+(n===4?'槓':'碰')+'了 '+label(t);render()}
function chi(t,need){need.forEach(x=>h[0].splice(h[0].indexOf(x),1));m[0].push(sort([...need,t]));d.pop();pending=null;turn=0;msg='你吃了 '+label(t);render()}
function cpu(){if(over)return;let p=turn;if(!draw(p))return;let t=h[p].splice(Math.floor(Math.random()*h[p].length),1)[0];d.push({p,t});msg='電腦 '+p+' 打出 '+label(t);let c=count(h[0]),a=[];if(win([...h[0],t]))a.push(['食糊',()=>finish('你食糊！')]);if(c[t]>=3)a.push(['槓 '+label(t),()=>claim(t,4)]);if(c[t]>=2)a.push(['碰 '+label(t),()=>claim(t,3)]);if(p===3&&t<27)for(let s=t-2;s<=t;s++){if(s<0||s%9>6||Math.floor(s/9)!==Math.floor(t/9))continue;let need=[s,s+1,s+2].filter(x=>x!==t);if(need.every(x=>c[x]))a.push(['吃 '+[s,s+1,s+2].map(label).join(''),()=>chi(t,need)])}if(a.length){turn=0;pending=a;render()}else advance(p)}
start();</script></html>
